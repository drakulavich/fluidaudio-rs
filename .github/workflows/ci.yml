name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (macOS, Apple Silicon)
    # macos-15 ships Xcode 16 / Swift 6, required by FluidAudio 0.14.1.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Swift version
        run: swift --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Downloaded sources. Portable across images and toolchains, so a stale
      # hit here is harmless and a prefix fallback is worth having.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # Build output. Not portable: `target/` holds binaries already linked
      # against the Swift staticlib that build.rs produces in `.build/`, so the
      # two have to be cached and invalidated together — caching `target/`
      # alone lets a linked binary survive while the library it points at does
      # not. Both are also specific to the image and the Xcode inside it.
      #
      # Hence: no restore-keys. A prefix fallback is what makes a cache unsound
      # here — it hands the job the *nearest* build tree rather than a matching
      # one, and `runner.os` is "macOS" for every macOS image, so a macos-14
      # tree would restore into a macos-15 job. Rebuilding takes well under a
      # minute; debugging a binary linked on another image does not.
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            target
            .build
          # macos-15 is the `runs-on` above — keep the two in step.
          key: build-macos-15-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('**/Cargo.lock', 'Package.resolved') }}

      - name: Build library
        run: cargo build --lib

      - name: Run FFI integration tests
        run: cargo test --test ffi_bindings

      - name: Run library unit tests
        run: cargo test --lib
