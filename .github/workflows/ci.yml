name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (macOS, Apple Silicon)
    # macos-15 ships Xcode 16 / Swift 6, required by FluidAudio 0.14.1.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Swift version
        run: swift --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build library
        run: cargo build --lib

      - name: Run FFI integration tests
        run: cargo test --test ffi_bindings

      - name: Run library unit tests
        run: cargo test --lib

  # ---------------------------------------------------------------------------
  # TEMPORARY — delete once the result is recorded in PR #21.
  #
  # The compute-unit escape hatch exists because FluidAudio's default mapping
  # pins four Kokoro stages (Albert / PostAlbert / Alignment / Vocoder) to the
  # Neural Engine, which is *claimed* to be unusable on a virtualised macOS
  # guest. The job above runs on macos-15, where the ANE works, so it cannot
  # test that claim at all — the motivating case has never been reproduced in
  # CI, only inferred from a downstream failure.
  #
  # This job runs the same synthesis on macos-14 under all four presets and
  # reports what actually happens. It measures rather than asserts: `default`
  # failing is the hypothesis under test, so it does not fail the build. The
  # build fails only when no preset at all synthesizes — an escape hatch that
  # rescues nothing — or when the probe never reached a compute-unit decision.
  # ---------------------------------------------------------------------------
  ane-escape-hatch-proof:
    name: "TEMP: Kokoro compute units on macos-14"
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Record host and Neural Engine visibility
        run: |
          # tee, not >>: the step summary is not reachable from `gh run view`,
          # so anything only written there is invisible when diagnosing a run.
          {
            echo "## Host"
            echo '```'
            sw_vers || true
            uname -m || true
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            echo "--- IORegistry entries matching ANE ---"
            ioreg -l 2>/dev/null | grep -ci "ane" || echo "no matches"
            echo "--- AppleNeuralEngine service ---"
            ioreg -c AppleARMIODevice -d 1 2>/dev/null | grep -i "ane" | head -5 || echo "none"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The macos-14 image has no plain `Xcode_16.app` — it ships 15.x plus
      # Xcode_16.1/16.2 — and its *default* toolchain is Swift 5.10, which
      # cannot build FluidAudio 0.14.8 (Swift tools 6.0). Pick the newest 16.x
      # actually present rather than guessing a filename.
      - name: Select the newest Xcode 16
        run: |
          ls /Applications | grep -i "^Xcode" || true
          xcode=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then
            echo "Selecting $xcode"
            sudo xcode-select -s "$xcode"
          else
            echo "::warning::No Xcode 16.x on this image; FluidAudio needs Swift 6."
          fi
          swift --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos14-probe-cargo-${{ hashFiles('**/Cargo.lock', 'Package.resolved') }}
          restore-keys: |
            macos14-probe-cargo-

      # Built as its own step so a toolchain problem is distinguishable from an
      # ANE problem: if this fails the job proves nothing about compute units.
      - name: Build the example
        run: cargo build --example kokoro --features tts

      - name: Synthesize under each preset
        run: |
          set +e
          # All four, not just default vs cpu-and-gpu. The escape hatch has three
          # non-default settings and testing one of them cannot show whether the
          # hatch works — the first run of this probe tested only `cpu-and-gpu`,
          # found it broken here, and could say nothing about `cpu-only`.
          PRESETS="default all-ane cpu-and-gpu cpu-only"

          # af_heart, not am_michael: it is the only English voice in the hosted
          # bundle. A dev machine with a pre-staged bundle hides this; a clean
          # runner gets a 404 and the probe measures nothing.
          for preset in $PRESETS; do
            cargo run -q --example kokoro --features tts -- \
              "Compute unit probe on a hosted runner" af_heart en-us "$preset" \
              > "/tmp/kokoro-$preset.wav" 2> "/tmp/kokoro-$preset.err"
            echo $? > "/tmp/kokoro-$preset.exit"
          done

          exit_of()  { cat "/tmp/kokoro-$1.exit"; }
          bytes_of() { grep -o 'WAV bytes: [0-9]*' "/tmp/kokoro-$1.err" | tail -1 | grep -o '[0-9]*'; }

          for preset in $PRESETS; do
            echo "===== $preset (exit $(exit_of "$preset")) ====="
            cat "/tmp/kokoro-$preset.err" || true
          done

          # A model/voice download failure aborts init before any prediction, so
          # it hits every preset identically and proves nothing about compute
          # units. Calling that "the escape hatch failed" would be a false
          # negative — an earlier run of this probe did exactly that, on a 404.
          setup_failure=""
          all_failed=1
          for preset in $PRESETS; do
            [ "$(exit_of "$preset")" -eq 0 ] && all_failed=0
          done
          if [ "$all_failed" -eq 1 ]; then
            for pat in "statusCode" "invalidResponse" "downloadFailed" "URLError"; do
              hits=0
              for preset in $PRESETS; do
                grep -q "$pat" "/tmp/kokoro-$preset.err" 2>/dev/null && hits=$((hits + 1))
              done
              if [ "$hits" -eq 4 ]; then
                setup_failure=$(grep -h -m1 "$pat" /tmp/kokoro-default.err | tr -d '`')
                break
              fi
            done
          fi

          # Which non-default presets actually synthesized.
          working=""
          for preset in all-ane cpu-and-gpu cpu-only; do
            [ "$(exit_of "$preset")" -eq 0 ] && working="$working $preset"
          done
          working=$(echo $working)

          {
            echo "## Result"
            echo
            echo "| preset | exit | WAV bytes |"
            echo "|---|---|---|"
            for preset in $PRESETS; do
              echo "| \`$preset\` | $(exit_of "$preset") | $(bytes_of "$preset" || echo '—') |"
            done
            echo
            echo "### Verdict"
            if [ -n "$setup_failure" ]; then
              echo "**Inconclusive** — the run never reached a compute-unit decision."
              echo "Every preset failed the same way before any prediction"
              echo "(\`$setup_failure\`), so this says nothing about the ANE either way."
            elif [ "$(exit_of default)" -eq 0 ]; then
              echo "Premise **not reproduced**: the default mapping synthesizes fine on this"
              echo "runner, so macos-14 is not evidence for needing the escape hatch."
            elif [ -n "$working" ]; then
              echo "Premise **confirmed**, and the escape hatch works: the ANE-pinned default"
              echo "fails here while these synthesize — \`$working\`."
            else
              echo "Premise **confirmed**, but the escape hatch **does not rescue this host**:"
              echo "the default fails *and* so does every alternative preset. The lever is"
              echo "real, but it is not sufficient here — see the per-preset errors above."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # `default` failing is the hypothesis, not a build failure. A probe that
          # measured nothing is broken. An escape hatch that rescues nothing is a
          # finding worth failing on.
          if [ -n "$setup_failure" ]; then
            echo "::error::probe never reached a compute-unit decision: $setup_failure"
            exit 1
          fi
          if [ "$(exit_of default)" -ne 0 ] && [ -z "$working" ]; then
            echo "::error::no compute-unit preset synthesizes on this host"
            exit 1
          fi
